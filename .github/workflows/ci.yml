# Merge gate. release.yml calls this workflow so a tag cannot skip the suite.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the vendoring locks
        id: lock
        run: |
          echo "sha=$(awk -F= '/^sha=/{print $2}' skill.lock)" >> "$GITHUB_OUTPUT"
          echo "hooks_sha=$(awk -F= '/^sha=/{print $2}' hooks.lock)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: memvara/memvara
          ref: ${{ steps.lock.outputs.sha }}
          path: _library

      # `test_the_vendored_skill_is_not_behind_the_library` needs the library's CURRENT
      # default branch, and the checkout above is pinned to skill.lock's sha -- so without
      # this the test cannot resolve `origin/main` locally and falls through to the GitHub
      # API. Unauthenticated calls are capped at 60/hour and Actions runners share IPs, so
      # that call answers 403 and the test SKIPS. It said so in the log -- "drift NOT
      # checked: HTTP Error 403: rate limit exceeded" -- and the job stayed green, so the
      # one guard against a frozen vendored skill had never once run here.
      #
      # One shallow ref, no token, no API. `--depth 1` because only the tip's tree is read.
      - name: Fetch the library's default branch, so the drift checks can run
        run: git -C _library fetch --depth 1 origin main:refs/remotes/origin/main

      # The hook tree is pinned by `hooks.lock`, separately from the skill, so the two
      # locks name different commits most of the time. ONE checkout serves both: fetching
      # that object into it lets the hook gate read the library with `git show`.
      #
      # Deliberately not a second `actions/checkout`. `MEMVARA_LIBRARY` names one
      # directory, so whichever lock it did not point at would fall through to
      # raw.githubusercontent -- one request per file, over twenty of them, on every run,
      # and a check that is one outage away from reporting the library unreachable. The
      # `git fetch <sha>` form is what `actions/checkout` itself does when handed a sha.
      - name: Fetch the hook tree's pinned commit into the same checkout
        run: git -C _library fetch --depth 1 origin ${{ steps.lock.outputs.hooks_sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Test
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          MEMVARA_LIBRARY: ${{ github.workspace }}/_library
          # Skip the freshness check on a tag, and only on a tag. Freshness compares the
          # vendored skill against the library's CURRENT default branch, so it is a fact
          # about the world now rather than about the commit under test: a tag passes the
          # day it is cut and the same tag re-run after the library's skill moves fails,
          # having changed nothing. v0.2.5 could never go green at all, and its release
          # job therefore never built its plugin.zip.
          #
          # Read off `github.ref`, which a reusable workflow inherits from the caller, so
          # a tag build is recognised without release.yml having to say anything. The
          # first attempt threaded a `workflow_call` input instead and was wrong in the
          # dangerous direction: `inputs` is null outside workflow_call, GitHub coerces
          # `null == false` to TRUE, and the check silently stopped running on pull
          # requests and pushes too. CI went green and the log said `OK (skipped=1)`.
          # This form has no such subtlety -- refs/tags/ or not.
          MEMVARA_SKIP_FRESHNESS: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: python3 -m unittest discover -s test -v
