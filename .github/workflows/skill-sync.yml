# Open a PR when memvara/memvara's packaged skill moves. Does not push to main.
name: Skill sync

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [skill-changed]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch library skill
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/memvara/memvara.git /tmp/memvara
          src=/tmp/memvara/memvara/skills/memvara
          if [ ! -f "$src/SKILL.md" ]; then
            echo "library default branch has no packaged skill yet; skip"
            echo "changed=false" >> "$GITHUB_ENV"
            exit 0
          fi
          rm -rf plugin/skills/memory
          mkdir -p plugin/skills
          cp -R "$src" plugin/skills/memory
          # The library calls this skill 'memvara'. Shipped inside a plugin already
          # named memvara it would render '/memvara:memvara', so the vendored copy is
          # renamed to 'memory' -- the one and only edit applied on sync, and the one
          # test_matches_library_at_lock_sha compensates for when it diffs the bytes.
          python3 - <<'RENAME'
          from pathlib import Path
          p = Path('plugin/skills/memory/SKILL.md')
          text = p.read_text(encoding='utf-8')
          if 'name: memvara\n' not in text:
              raise SystemExit('library frontmatter is no longer "name: memvara"')
          p.write_text(text.replace('name: memvara\n', 'name: memory\n', 1), encoding='utf-8')
          RENAME
          sha=$(git -C /tmp/memvara rev-parse HEAD)
          python3 -c "
          from pathlib import Path
          Path('skill.lock').write_text(
              '# The library commit whose memvara/skills/memvara/ tree this plugin vendors.\\n'
              '# CI diffs plugin/skills/memory against that SHA, allowing exactly one edit: the\\n'
              '# frontmatter name, which becomes \'memory\' so the skill reads /memvara:memory.\\n'
              '# skill-sync.yml updates this file when it opens a PR.\\n'
              'repo=memvara/memvara\\n'
              f'sha=$sha\\n'
              'path=memvara/skills/memvara\\n'
          )
          "
          if git diff --quiet -- plugin/skills/memory skill.lock; then
            echo "changed=false" >> "$GITHUB_ENV"
          else
            echo "changed=true" >> "$GITHUB_ENV"
            echo "sha=$sha" >> "$GITHUB_ENV"
          fi

      - name: Open PR
        if: env.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # A PAT when the org has provisioned one, GITHUB_TOKEN otherwise.
          #
          # The default is GITHUB_TOKEN, and on this org GITHUB_TOKEN cannot open a pull
          # request: the organization pins every repository to read-only workflow
          # permissions with "Allow GitHub Actions to create and approve pull requests"
          # off, which is why that box is greyed out in the repository settings rather
          # than merely unticked. Every scheduled run from 2026-08-21 to 2026-08-25
          # fetched the skill correctly and then died on the last step with "GitHub
          # Actions is not permitted to create or approve pull requests".
          #
          # A PAT is not GITHUB_TOKEN, so it is not subject to that ceiling, and this
          # fixes the sync without loosening the policy for every workflow in four
          # repositories. Falls back so the workflow keeps working unchanged wherever
          # the policy does allow it.
          token: ${{ secrets.PLUGIN_SYNC_TOKEN || github.token }}
          commit-message: "chore: sync skill from memvara/memvara@${{ env.sha }}"
          title: "chore: sync skill from memvara/memvara@${{ env.sha }}"
          body: |
            Vendored skill drifted from [memvara/memvara](https://github.com/memvara/memvara) `${{ env.sha }}`.
            This PR only copies `memvara/skills/memvara/` to `plugin/skills/memory/`
            (renaming the skill so it reads `/memvara:memory`) and updates `skill.lock`.
            CI still has to pass before merge.
          branch: sync/skill-${{ env.sha }}
          delete-branch: true
