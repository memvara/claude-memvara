# Open a PR when memvara/memvara's packaged skill moves. Does not push to main.
name: Skill sync

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [skill-changed]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch library skill
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/memvara/memvara.git /tmp/memvara
          src=/tmp/memvara/memvara/skills/memvara
          if [ ! -f "$src/SKILL.md" ]; then
            echo "library default branch has no packaged skill yet; skip"
            echo "changed=false" >> "$GITHUB_ENV"
            exit 0
          fi
          # CLAUDE.md is shared across every repo in plugin-repos.txt and nothing used to
          # carry it, so it was hand-copied and drifted -- a section written in one of them
          # reached none of the others. The canonical is `plugin-claude.md` in the library;
          # everything between the `local:` markers belongs to THIS repository and survives,
          # because two of its sections legitimately differ per repo (its runtime facts, and
          # the hook rules that only this plugin needs).
          # Addressed from the clone root, not by walking up from $src. The first version
          # counted one `..` short, resolved to a path that does not exist, and took the
          # not-found branch below on every run since it shipped.
          python3 - /tmp/memvara/plugin-claude.md <<'COMPOSE'
          import pathlib, sys
          BEGIN = "<!-- local: begin — this repository's own facts; skill-sync preserves this block -->"
          END = "<!-- local: end -->"
          canonical = pathlib.Path(sys.argv[1])
          if not canonical.is_file():
              # Loud. This exact branch ran on every sync from the day it shipped, printed
              # its honest line into a log nobody reads, and let the job go green while
              # CLAUDE.md was never composed at all. The canonical exists; not finding it
              # can only mean the clone or the path is wrong, and neither is a reason to
              # report success.
              raise SystemExit(f"canonical not found at {canonical} -- "
                               "the library clone or this path is wrong")
          here = pathlib.Path("CLAUDE.md")
          text = here.read_text(encoding="utf-8")
          if BEGIN not in text or END not in text:
              # Refuse rather than guess. Splicing without both markers would replace this
              # repository's own sections with the canonical's placeholder and lose them.
              # Also loud, for the same reason. Every one of these repositories has the
              # markers and a test that requires exactly one pair, so their absence is a
              # broken checkout rather than a repository that opted out.
              raise SystemExit("CLAUDE.md has no local block; refusing to splice")
          local = text[text.index(BEGIN) + len(BEGIN):text.index(END)]
          out = canonical.read_text(encoding="utf-8").replace(
              "@@LOCAL@@\n", BEGIN + local + END + "\n", 1)
          here.write_text(out, encoding="utf-8")
          print("CLAUDE.md composed from the canonical, local block preserved")
          COMPOSE

          rm -rf plugin/skills/memory
          mkdir -p plugin/skills
          cp -R "$src" plugin/skills/memory
          # The library calls this skill 'memvara'. Shipped inside a plugin already
          # named memvara it would render '/memvara:memvara', so the vendored copy is
          # renamed to 'memory' -- the one and only edit applied on sync, and the one
          # test_matches_library_at_lock_sha compensates for when it diffs the bytes.
          python3 - <<'RENAME'
          from pathlib import Path
          p = Path('plugin/skills/memory/SKILL.md')
          text = p.read_text(encoding='utf-8')
          if 'name: memvara\n' not in text:
              raise SystemExit('library frontmatter is no longer "name: memvara"')
          p.write_text(text.replace('name: memvara\n', 'name: memory\n', 1), encoding='utf-8')
          RENAME
          # Decided from the TREE, and BEFORE the lock is rewritten. A sha bumped
          # unconditionally makes the check fire on every library commit, skill-touching
          # or not, opening a pull request whose whole diff is one sha line. Seven
          # repositories carried exactly such a PR, open and unread, until they were
          # closed by hand. Both shas name a commit holding these exact bytes when the
          # tree is unchanged, so both are truthful and there is nothing to open a PR
          # about. `skill.lock` is deliberately NOT in the comparison: it is the derived
          # half, and comparing it is what made the decision circular.
          #
          # `git status --porcelain`, not `git diff`, because only the former sees
          # UNTRACKED files: a file the library ADDS lands untracked after `cp -R`, and
          # a `git diff` gate would drop it, then re-copy it nightly in silence.
          # CLAUDE.md stays in the comparison -- a canonical-only change composes a new
          # file here and must still ship.
          if [ -z "$(git status --porcelain -- plugin/skills/memory CLAUDE.md)" ]; then
            echo "changed=false" >> "$GITHUB_ENV"
            exit 0
          fi

          sha=$(git -C /tmp/memvara rev-parse HEAD)
          python3 -c "
          from pathlib import Path
          Path('skill.lock').write_text(
              '# The library commit whose memvara/skills/memvara/ tree this plugin vendors.\\n'
              '# CI diffs plugin/skills/memory against that SHA, allowing exactly one edit: the\\n'
              '# frontmatter name, which becomes \'memory\' so the skill reads /memvara:memory.\\n'
              '# skill-sync.yml updates this file when it opens a PR.\\n'
              'repo=memvara/memvara\\n'
              f'sha=$sha\\n'
              'path=memvara/skills/memvara\\n'
          )
          "
          # CLAUDE.md is in the list, or a canonical-only change composes a new file and
          # opens nothing -- the sync would run, succeed, and leave the edit unshipped.
          echo "changed=true" >> "$GITHUB_ENV"
          echo "sha=$sha" >> "$GITHUB_ENV"

      - name: Open PR
        if: env.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # A PAT when the org has provisioned one, GITHUB_TOKEN otherwise.
          #
          # The default is GITHUB_TOKEN, and on this org GITHUB_TOKEN cannot open a pull
          # request: the organization pins every repository to read-only workflow
          # permissions with "Allow GitHub Actions to create and approve pull requests"
          # off, which is why that box is greyed out in the repository settings rather
          # than merely unticked. Every scheduled run from 2026-08-21 to 2026-08-25
          # fetched the skill correctly and then died on the last step with "GitHub
          # Actions is not permitted to create or approve pull requests".
          #
          # A PAT is not GITHUB_TOKEN, so it is not subject to that ceiling, and this
          # fixes the sync without loosening the policy for every workflow in four
          # repositories. Falls back so the workflow keeps working unchanged wherever
          # the policy does allow it.
          token: ${{ secrets.PLUGIN_SYNC_TOKEN || github.token }}
          commit-message: "chore: sync skill from memvara/memvara@${{ env.sha }}"
          title: "chore: sync skill from memvara/memvara@${{ env.sha }}"
          body: |
            Vendored skill drifted from [memvara/memvara](https://github.com/memvara/memvara) `${{ env.sha }}`.
            This PR copies `memvara/skills/memvara/` to `plugin/skills/memory/` (renaming
            the skill so it reads `/memvara:memory`), composes `CLAUDE.md` from the
            library's `plugin-claude.md` while preserving this repository's own `local:`
            block, and updates `skill.lock`.
            CI still has to pass before merge.
          branch: sync/skill-${{ env.sha }}
          delete-branch: true
