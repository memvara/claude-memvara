# CD for a git marketplace: a tag is what installers can pin. CI must pass first.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # The whole suite still runs -- a tag must not skip it -- minus the one check that
    # asks about the world rather than about this commit. v0.2.5 is why: tagged a day
    # late, its run re-checked a day-old tree against today's library and could never
    # pass, so the release job never produced its plugin.zip. That would eventually hit
    # every tag here, since re-running any past release fails the moment the library's
    # skill moves.
    with:
      check_skill_freshness: false

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches plugin.json version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python3 -c "import json; print(json.load(open('plugin/.claude-plugin/plugin.json'))['version'])")
          test "$tag" = "$ver"

      - name: Zip plugin
        run: zip -r plugin.zip plugin README.md LICENSE skill.lock

      - uses: softprops/action-gh-release@v2
        with:
          files: plugin.zip
          generate_release_notes: true
