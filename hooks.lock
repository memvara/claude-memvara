# The library commit whose plugin/hooks/ tree this plugin vendors.
# CI diffs plugin/hooks against that SHA byte for byte, with no transforms at all --
# unlike skill.lock, which allows exactly one line.
# host= names the record in hooks/hosts/ that hooks/hooks.json is generated from. It is
# this repository's own: hooks-sync.yml reads it and writes it back, never overwrites it.
repo=memvara/memvara
sha=a4789634262f64efae318f306d90b0756e8877fe
path=plugin/hooks
host=claude
